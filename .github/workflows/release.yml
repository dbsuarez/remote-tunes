name: Release APK

# Builds the Android app and publishes it as a GitHub Release, which is also
# where the app's own "Check for updates" looks.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# One-time setup (Settings > Secrets and variables > Actions > New secret):
#   RELEASE_KEYSTORE_BASE64  the signing key, from tool/export_signing_key.ps1.
#                            Every release MUST be signed with the same key, or
#                            phones refuse the update.
#   JAMENDO_CLIENT_ID        (optional) built into the app for the Online tab.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true

      - name: Check the signing key is there
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the RELEASE_KEYSTORE_BASE64 secret first (see the comment at the top of release.yml)."
            exit 1
          fi

      - run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Set up signing
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/release.keystore
          cat > android/key.properties <<EOF
          storeFile=../release.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Build
        env:
          JAMENDO: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          VERSION="${TAG#v}"
          DEFINES=""
          if [ -n "$JAMENDO" ]; then
            printf '{"JAMENDO_CLIENT_ID":"%s"}' "$JAMENDO" > /tmp/jamendo.json
            DEFINES="--dart-define-from-file=/tmp/jamendo.json"
          fi
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" $DEFINES

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" *-release.apk --clobber
          else
            gh release create "$TAG" *-release.apk --title "RemoteTunes ${TAG#v}" --generate-notes
          fi
