name: remote_tunes
description: "RemoteTunes - offline-first remote control for music playback between two Android phones."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  supabase_flutter: ^2.8.0
  just_audio: ^0.10.0
  audio_service: ^0.18.18
  file_picker: ^8.0.0
  uuid: ^4.5.1
  shelf: ^1.4.3
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3
  bonsoir: ^6.0.3
  audio_metadata_reader: ^1.8.1
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  crypto: ^3.0.8
  image: ^4.13.1
  http: ^1.6.0
  record: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: 2.4.15
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true

